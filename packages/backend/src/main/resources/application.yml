spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/attendance}
    username: ${DATABASE_USERNAME:attendance}
    password: ${DATABASE_PASSWORD:attendance}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 28800000
